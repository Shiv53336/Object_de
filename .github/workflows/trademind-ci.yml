name: trademind-ci

on:
  push:
    paths: ["trademind/**", ".github/workflows/trademind-ci.yml"]
  pull_request:
    paths: ["trademind/**", ".github/workflows/trademind-ci.yml"]

jobs:
  test:
    # Linux is the server; Windows is the owner's laptop for local testing (docs/TESTING.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: trademind
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
